<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Blocker</title>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 25px;
            border: 1px dashed #313244;
            border-radius: 12px;
            background: #181825;
        }
        h1 { color: #89b4fa; margin-top: 0; }
        p { color: #a6e3a1; font-size: 14px; line-height: 1.5; }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #89b4fa;
            color: #11111b;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b4befe; }
        .btn-secondary {
            background: #313244;
            color: #cdd6f4;
        }
        .btn-secondary:hover { background: #45475a; }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #6c7086;
        }
        .footer a {
            color: #89b4fa;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Sovereign Blocker</h1>
        <p>Dynamic digital sovereignty content and search result blocker for Firefox.</p>
        <p>Take control of your search engine results with a lightweight, local, and customizable blacklist.</p>
        
        <div class="btn-group">
            <a class="btn" href="https://addons.mozilla.org/en-US/firefox/addon/sovereign-blocker/" target="_blank">Install on Firefox</a>
            <a class="btn btn-secondary" href="https://github.com/kazhimee/Sovereign-Blocker" target="_blank">View on GitHub</a>
        </div>

        <div class="footer">
            Support: <a href="mailto:kazhimeofficial@gmail.com">kazhimeofficial@gmail.com</a> | Developer: Kazhime Kagemori
        </div>
    </div>
</body>
</html>
