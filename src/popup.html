<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign Blocker</title>
  <style>
    body {
      width: 320px;
      background: #11111b;
      color: #cdd6f4;
      font-family: monospace;
      padding: 14px;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #313244;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    h2 { font-size: 14px; margin: 0; color: #89b4fa; }
    
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
      border-bottom: 1px solid #313244;
      padding-bottom: 8px;
    }
    .tab-btn {
      background: #181825;
      color: #6c7086;
      border: 1px solid #313244;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      flex: 1;
      text-align: center;
    }
    .tab-btn.active {
      background: #89b4fa;
      color: #11111b;
      border-color: #89b4fa;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #313244;
      transition: .4s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: #cdd6f4;
      transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #a6e3a1; }
    input:checked + .slider:before { transform: translateX(14px); }
    
    .input-group { display: flex; gap: 6px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1; background: #181825; border: 1px solid #313244;
      color: #cdd6f4; padding: 6px; border-radius: 4px; font-family: monospace;
    }
    button.action-btn {
      background: #89b4fa; color: #11111b; border: none;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .list { max-height: 150px; overflow-y: auto; margin-bottom: 6px; }
    .item {
      background: #181825; padding: 6px 8px; margin-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 4px; font-size: 12px;
    }
    .item button { background: #f38ba8; color: #11111b; padding: 2px 6px; font-size: 10px; border: none; border-radius: 3px; cursor: pointer;}
    
    .immutable-about {
      background: #181825;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      border: 1px solid #313244;
    }
    .immutable-about .dev-name { color: #f9e2af; font-weight: bold; }
    .immutable-about a { color: #89b4fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🛡️ Sovereign Blocker</h2>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-target="filterTab">Filter</button>
    <button class="tab-btn" data-target="aboutTab">About</button>
  </div>

  <div id="filterTab" class="tab-content active">
    <div class="input-group">
      <input type="text" id="keywordInput" placeholder="Add keyword...">
      <button class="action-btn" id="addBtn">Add</button>
    </div>
    <div class="list" id="keywordList"></div>
  </div>

  <div id="aboutTab" class="tab-content">
    <div class="immutable-about" id="sovereignAboutSection" data-locked="true">
      <div>Developer: <span class="dev-name">Kazhime Kagemori</span></div>
      <div style="margin-top: 6px;">Support: <a href="mailto:kazhimeofficial@gmail.com">kazhimeofficial@gmail.com</a></div>
      <div style="margin-top: 6px;"><a href="https://github.com/kazhimee/Sovereign-Blocker" target="_blank">GitHub Repository</a></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
